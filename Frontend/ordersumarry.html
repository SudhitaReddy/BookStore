<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/media.css">

</head>
<body class="bg-light">
     <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">BookStore</a>
            <div class="ms-auto">
            <a class="btn btn-outline-light" href="cart.html">
                <i class="bi bi-cart"></i> Cart
            </a>
            </div>
        </div>
      </nav>

    <div class="container py-5">
        <h2 class="mb-4 text-center">🧾 Order Summary</h2>

        <div class="summary-box">

        <!-- Item List -->
            <div class="mb-4">
                <h5 class="mb-3">Your Items</h5>

                <div class="d-flex align-items-center mb-3">
                <img src="../img/b1.jpg" class="item-img me-3" alt="Book">
                <div class="flex-grow-1">
                    <div>May Be You should Talk To Someone</div>
                    <small class="text-muted">Qty: 1</small>
                </div>
                <div class="text-end">₹499</div>
                </div>

                <div class="d-flex align-items-center mb-3">
                <img src="../img/b2.jpg" class="item-img me-3" alt="Book">
                <div class="flex-grow-1">
                    <div>Atomic Habits</div>
                    <small class="text-muted">Qty: 2</small>
                </div>
                <div class="text-end">₹798</div>
                </div>
            </div>

        <!-- Shipping Info -->
            <div class="mb-4">
                <h5 class="mb-3">Shipping Address</h5>
                <form>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Street Address" required>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                    <input type="text" class="form-control" placeholder="City" required>
                    </div>
                    <div class="col-md-6">
                    <input type="text" class="form-control" placeholder="Pincode" required>
                    </div>
                </div>
                </form>
            </div>

        <!-- Totals -->
            <div class="border-top pt-3 mb-3">
                <div class="d-flex justify-content-between mb-2">
                    <span>Subtotal</span>
                    <span>₹1,297</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Shipping</span>
                    <span>₹50</span>
                </div>
                <div class="d-flex justify-content-between total-line">
                    <span>Total</span>
                    <span>₹1,347</span>
                </div>
            </div>

        <!-- Place Order Button -->
            <div class="text-end">
                <button class="btn btn-success btn-lg">
                <i class="bi bi-bag-check"></i> Place Order
                </button>
            </div>
        </div>
       
    </div>
     <footer class="bg-dark text-white text-center py-5 mt-4 mb-0">
                    © 2025 BookStore. All rights reserved.
     </footer>
  

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
